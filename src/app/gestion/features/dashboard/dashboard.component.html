<div class="min-h-[100dvh] bg-slate-50 flex">
  <app-sidebar></app-sidebar>
  <main class="flex-1 flex flex-col w-full lg:pl-[280px] min-w-0 transition-all">
    <div class="p-6 pt-20 lg:pt-8 lg:p-8 flex flex-col gap-6 max-w-[1600px] w-full mx-auto">

      <app-header-title
        [title]="title"
        [subtitle]="subtitle"
        [username]="username"
        [userInitials]="userInitials">
      </app-header-title>

      <!-- Estado de carga -->
      <div *ngIf="isLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div *ngFor="let i of [1,2,3,4]"
          class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 h-36 animate-pulse">
          <div class="flex justify-between mb-4">
            <div class="h-4 bg-slate-200 rounded w-1/2"></div>
            <div class="w-10 h-10 bg-slate-200 rounded-full"></div>
          </div>
          <div class="h-8 bg-slate-200 rounded w-1/3 mb-3"></div>
          <div class="h-3 bg-slate-200 rounded w-2/3"></div>
        </div>
      </div>

      <!-- Estado de error -->
      <div *ngIf="!isLoading && hasError"
        class="bg-red-50 border border-red-200 rounded-2xl p-6 flex items-center gap-4 text-red-700">
        <span class="material-symbols-rounded text-3xl">error_outline</span>
        <div>
          <p class="font-semibold">No se pudieron cargar las métricas</p>
          <p class="text-sm text-red-500">Verifica tu conexión o intenta de nuevo más tarde.</p>
        </div>
        <button (click)="cargarMetricas()"
          class="ml-auto bg-red-100 hover:bg-red-200 text-red-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          Reintentar
        </button>
      </div>

      <!-- Métricas reales -->
      <app-dashboard-metrics
        *ngIf="!isLoading && !hasError"
        [metrics]="metrics">
      </app-dashboard-metrics>

      <!-- Gráfica de ingresos -->
      <app-dashboard-energy-chart></app-dashboard-energy-chart>

    </div>
  </main>
</div>
