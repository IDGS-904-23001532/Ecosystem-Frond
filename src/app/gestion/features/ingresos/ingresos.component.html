<div class="min-h-[100dvh] bg-slate-50 flex">
  <app-sidebar></app-sidebar>
  <main class="flex-1 flex flex-col w-full lg:pl-[280px] min-w-0 transition-all">
    <div class="p-6 pt-20 lg:pt-8 lg:p-8 flex flex-col gap-6 max-w-[1600px] w-full mx-auto">
      
      <!-- Título -->
      <app-header-title [title]="title" [subtitle]="subtitle" [username]="username" [userInitials]="userInitials"></app-header-title>

      <!-- Filtros de fecha (Top Actions) -->
      <section class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto items-center">
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label class="text-sm font-medium text-slate-600 whitespace-nowrap">Desde:</label>
            <input type="date" [(ngModel)]="fechaInicio" (change)="cargarPeriodo()" class="w-full sm:w-auto px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-slate-600" />
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label class="text-sm font-medium text-slate-600 whitespace-nowrap">Hasta:</label>
            <input type="date" [(ngModel)]="fechaFin" (change)="cargarPeriodo()" class="w-full sm:w-auto px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-slate-600" />
          </div>
        </div>
      </section>

      <!-- Tarjetas -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div *ngFor="let card of tarjetasIngresos" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl bg-emerald-50" [ngClass]="card.iconClass">
            <span class="material-symbols-rounded">{{ card.icon }}</span>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-500">{{ card.label }}</p>
            <h3 class="text-2xl font-bold text-slate-800">{{ card.value }}</h3>
          </div>
        </div>
      </div>

      <!-- Gráfica Anual -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <div class="mb-8 flex justify-between items-center">
          <div>
            <h3 class="text-xl font-bold text-slate-800">Ingresos Anuales</h3>
            <p class="text-slate-500 text-sm mt-1">Comparativa de ingresos del año {{ anioGrafica }}</p>
          </div>
          <div class="flex items-center gap-4">
            <button (click)="cambiarAnio(-1)" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200 transition-colors shadow-sm">
              <span class="material-symbols-rounded text-sm">chevron_left</span>
            </button>
            <span class="font-bold text-slate-700 w-12 text-center">{{ anioGrafica }}</span>
            <button (click)="cambiarAnio(1)" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200 transition-colors shadow-sm">
              <span class="material-symbols-rounded text-sm">chevron_right</span>
            </button>
          </div>
        </div>
        
        <div class="flex items-end justify-between gap-1 sm:gap-2 h-64 mt-4 w-full px-1 sm:px-4 border-b-2 border-slate-100 pb-2 overflow-x-auto">
          <div *ngFor="let mes of mesesGrafica" class="relative flex flex-col items-center justify-end h-full w-full group min-w-[30px]">
            <!-- Tooltip -->
            <div class="absolute -top-10 bg-slate-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-10 shadow-lg">
              Valor: {{ mes.porcentaje }}%
            </div>
            <!-- Barra -->
            <div class="w-full max-w-[40px] rounded-t-xl transition-all duration-500 bg-emerald-400 group-hover:bg-emerald-500 group-hover:shadow-md group-hover:shadow-emerald-500/30" 
                 [style.height.%]="mes.porcentaje"></div>
            <span class="mt-4 text-xs sm:text-sm font-medium text-slate-500 group-hover:text-emerald-700 group-hover:font-bold transition-colors">{{ mes.nombre }}</span>
          </div>
        </div>
      </section>

      <!-- Tabla -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <app-table [columns]="columnasIngresos" [data]="datosIngresos" [isLoading]="isLoadingTabla" [showActions]="false" emptyMessage="No hay ingresos registrados en este periodo."></app-table>
      </div>

    </div>
  </main>
</div>
