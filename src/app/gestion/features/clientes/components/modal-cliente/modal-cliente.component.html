<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] flex items-center justify-center p-4 transition-opacity duration-300" *ngIf="isVisible">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col animate-in zoom-in-95 duration-200">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
      <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span class="material-symbols-rounded text-emerald-500 text-[22px]">{{ isEditing ? 'edit' : 'person_add' }}</span>
        {{ isEditing ? 'Editar Cliente' : 'Registrar Cliente' }}
      </h2>
      <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200 transition-colors" (click)="cerrar()">
        <span class="material-symbols-rounded text-[20px]">close</span>
      </button>
    </div>

    <form [formGroup]="clientForm" class="p-6 flex flex-col gap-4 max-h-[70vh] overflow-y-auto">

      <!-- Nombre y Apellido en grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Nombre</label>
          <div class="relative">
            <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">badge</span>
            <input type="text" formControlName="nombre" placeholder="Juan" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
              [class.border-red-300]="clientForm.get('nombre')?.invalid && clientForm.get('nombre')?.touched">
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Apellido</label>
          <div class="relative">
            <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">badge</span>
            <input type="text" formControlName="apellido" placeholder="Pérez" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
              [class.border-red-300]="clientForm.get('apellido')?.invalid && clientForm.get('apellido')?.touched">
          </div>
        </div>
      </div>

      <!-- Teléfono -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Teléfono</label>
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">call</span>
          <input type="tel" formControlName="telefono" placeholder="477 123 4567" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            [class.border-red-300]="clientForm.get('telefono')?.invalid && clientForm.get('telefono')?.touched">
        </div>
      </div>

      <!-- Localidad -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Localidad / Dirección</label>
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">location_on</span>
          <input type="text" formControlName="localidad" placeholder="León, Guanajuato" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            [class.border-red-300]="clientForm.get('localidad')?.invalid && clientForm.get('localidad')?.touched">
        </div>
      </div>

      <!-- Corporativo (opcional) -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Corporativo <span class="text-slate-400 font-normal normal-case">(opcional)</span></label>
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">business</span>
          <input type="text" formControlName="corporativo" placeholder="Empresa S.A. de C.V." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
        </div>
      </div>

    </form>

    <!-- Footer actions -->
    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-3">
      <button type="button" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-200 transition-colors" (click)="cerrar()">
        Cancelar
      </button>
      <button type="button"
        class="px-6 py-2 rounded-xl text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5"
        [disabled]="clientForm.invalid"
        (click)="guardar()">
        <span class="material-symbols-rounded text-[18px]">{{ isEditing ? 'save' : 'person_add' }}</span>
        {{ isEditing ? 'Guardar Cambios' : 'Registrar' }}
      </button>
    </div>
  </div>
</div>
