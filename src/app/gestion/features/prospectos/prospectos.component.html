<div class="min-h-[100dvh] bg-slate-50 flex">
  <app-sidebar></app-sidebar>
  <main class="flex-1 flex flex-col w-full lg:pl-[280px] min-w-0 transition-all">
    <div class="p-6 pt-20 lg:pt-8 lg:p-8 flex flex-col gap-6 max-w-[1600px] w-full mx-auto">

      <app-header-title [title]="title" [subtitle]="subtitle" [username]="username" [userInitials]="userInitials">
      </app-header-title>

      <!-- Top Actions -->
      <section class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
          <input type="text" placeholder="Buscar prospecto..." [(ngModel)]="terminoBusqueda"
            class="w-full sm:w-64 pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all" />
        </div>

        <app-button [text]="'Nuevo Prospecto'" [type]="'button'"
          [buttonClass]="'bg-emerald-600 hover:bg-emerald-700 hover:shadow-md hover:shadow-emerald-600/20 w-full sm:w-auto transition-all rounded-xl py-2 px-4 flex items-center justify-center gap-2'"
          (click)="agregarProspecto()">
          <span class="material-symbols-rounded text-sm">person_add</span>
        </app-button>
      </section>

      <!-- Tarjetas KPI -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div *ngFor="let card of tarjetasProspectos" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-4 hover:shadow-md transition-all">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-emerald-50 text-emerald-600">
            <span class="material-symbols-rounded text-2xl">{{ card.icon }}</span>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-500">{{ card.label }}</p>
            <h3 class="text-2xl font-bold text-slate-800">{{ card.value }}</h3>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <app-table
          [columns]="columnasProspectos"
          [data]="prospectosFiltrados"
          [isLoading]="isLoading"
          [showActions]="false"
          emptyMessage="No se encontraron prospectos registrados."
          (actionClick)="manejarAccion($event)">
        </app-table>
      </div>

    </div>
  </main>
</div>

<!-- Modal Nuevo Prospecto -->
<div *ngIf="mostrarModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col animate-in zoom-in-95 duration-200">

    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
      <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span class="material-symbols-rounded text-emerald-500 text-[22px]">person_add</span>
        Registrar Prospecto
      </h2>
      <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200 transition-colors" (click)="cerrarModal()">
        <span class="material-symbols-rounded text-[20px]">close</span>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="prospectoForm" class="p-6 flex flex-col gap-4 max-h-[65vh] overflow-y-auto">

      <!-- Nombre y Apellido -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Nombre *</label>
          <div class="relative">
            <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">badge</span>
            <input type="text" formControlName="nombre" placeholder="Juan"
              class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
              [class.border-red-300]="prospectoForm.get('nombre')?.invalid && prospectoForm.get('nombre')?.touched">
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Apellido *</label>
          <div class="relative">
            <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">badge</span>
            <input type="text" formControlName="apellido" placeholder="Pérez"
              class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
              [class.border-red-300]="prospectoForm.get('apellido')?.invalid && prospectoForm.get('apellido')?.touched">
          </div>
        </div>
      </div>

      <!-- Teléfono -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Teléfono *</label>
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">call</span>
          <input type="tel" formControlName="telefono" placeholder="477 123 4567"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            [class.border-red-300]="prospectoForm.get('telefono')?.invalid && prospectoForm.get('telefono')?.touched">
        </div>
      </div>

      <!-- Localidad -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Localidad *</label>
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">location_on</span>
          <input type="text" formControlName="localidad" placeholder="León, Guanajuato"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            [class.border-red-300]="prospectoForm.get('localidad')?.invalid && prospectoForm.get('localidad')?.touched">
        </div>
      </div>

      <!-- Corporativo (opcional) -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
          Corporativo <span class="text-slate-400 font-normal normal-case">(opcional)</span>
        </label>
        <div class="relative">
          <span class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">business</span>
          <input type="text" formControlName="corporativo" placeholder="Empresa S.A. de C.V."
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
        </div>
      </div>

    </form>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-3">
      <button type="button" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-200 transition-colors" (click)="cerrarModal()">
        Cancelar
      </button>
      <button type="button"
        class="px-6 py-2 rounded-xl text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5"
        [disabled]="prospectoForm.invalid"
        (click)="guardarProspecto()">
        <span class="material-symbols-rounded text-[18px]">person_add</span>
        Registrar
      </button>
    </div>

  </div>
</div>
