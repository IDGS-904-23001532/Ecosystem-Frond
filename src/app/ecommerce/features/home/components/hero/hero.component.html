<section
  class="relative flex flex-col items-center justify-center min-h-[100dvh] overflow-hidden pt-20"
>
  <!-- Imagen de fondo completa con overlay cinematográfico -->
  <div class="absolute inset-0 z-0">
    <!-- Gradiente para asegurar legibilidad en todas partes -->
    <div
      class="absolute inset-0 bg-gradient-to-b from-[#1E222A]/80 via-[#1B3B2B]/60 to-[#1E222A] z-10"
    ></div>
    <!-- Oscurecimiento sutil -->
    <div class="absolute inset-0 bg-black/30 z-10 mix-blend-multiply"></div>
    <img
      src="/panel_solar_inicio.jfif"
      alt="Paneles Solares"
      class="w-full h-full object-cover object-center z-0 scale-105"
    />
  </div>

  <!-- Luces volumétricas (Glows) -->
  <div
    class="absolute top-0 right-1/4 w-[45vw] h-[45vw] bg-[#00E676] rounded-full blur-[180px] opacity-15 z-10 pointer-events-none -translate-y-1/2"
  ></div>
  <div
    class="absolute bottom-0 left-1/4 w-[50vw] h-[50vw] bg-teal-500 rounded-full blur-[200px] opacity-10 z-10 pointer-events-none translate-y-1/2"
  ></div>

  <!-- Contenido Principal -->
  <div
    class="relative z-20 w-full max-w-7xl px-6 md:px-12 mx-auto flex flex-col items-center justify-center flex-grow mt-10"
  >
    <!-- Título principal majestuoso -->
    <h1
      class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-white tracking-tight leading-[1.05] text-center mb-4 drop-shadow-2xl"
    >
      Experiencia y tecnología <br class="hidden lg:block" />
      en industria energética
    </h1>

    <!-- Subtítulo refinado -->
    <p
      class="text-lg md:text-xl lg:text-2xl text-slate-300 font-light mb-14 max-w-4xl mx-auto text-center leading-relaxed drop-shadow-md"
    >
      Acelera la transición hacia un futuro sustentable. Soluciones integradas que brindan
      <strong class="text-white font-medium">energía limpia y confiable</strong> para hogares y
      empresas, maximizando tu rentabilidad.
    </p>

    <!-- Botones Ultra Premium -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-6 w-full sm:w-auto">
      <button
        routerLink="/conocenos/contactar"
        class="w-full sm:w-auto px-12 py-4 rounded-full bg-white text-[#1B3B2B] font-extrabold text-lg hover:bg-slate-100 hover:scale-105 transition-all duration-300 shadow-lg"
      >
        Agenda una asesoría
      </button>
      <button
        (click)="navigateToCalculadora()"
        class="w-full sm:w-auto px-12 py-4 rounded-full bg-white/5 backdrop-blur-2xl text-white font-bold text-lg border border-white/20 hover:bg-white/10 hover:border-white/40 transition-all duration-300 shadow-xl group flex items-center gap-3 justify-center"
      >
        Calcula tu ahorro
        <span
          class="material-symbols-rounded text-base group-hover:translate-x-1 transition-transform"
          >arrow_forward</span
        >
      </button>
    </div>
  </div>
</section>
